// 分组集合 = usable_group（已授权的）× 被模型引用的（可能更多）
function groups(){
  const c=ch();
  const ref=new Map();
  c.models.forEach(m=>(m.g||[]).forEach(g=>{
    if(!ref.has(g)) ref.set(g,0);
    ref.set(g,ref.get(g)+1);
  }));
  const ug=c.usable_group||{}, gr=c.group_ratio||{};
  const names=new Set([...Object.keys(ug),...ref.keys()]);
  return [...names].map(n=>({
    name:n, ratio:gr[n]??null, desc:ug[n]??null,
    authorized:Object.prototype.hasOwnProperty.call(ug,n),
    count:ref.get(n)||0
  })).sort((a,b)=>{
    if(a.authorized!==b.authorized) return a.authorized?-1:1;
    return b.count-a.count||a.name.localeCompare(b.name,"zh-CN");
  });
}
function curG(){ return S.g?groups().find(x=>x.name===S.g):null; }
function modelsOf(g){ return g?ch().models.filter(m=>(m.g||[]).includes(g.name)):[]; }
function unlisted(){ // 被引用但未在 usable_group 定义
  return groups().filter(g=>!g.authorized);
}
function localExtra(){
  const c=ch(); const up=new Set(groups().map(g=>g.name));
  return (c.local_snapshot||[]).filter(n=>!up.has(n));
}

function row(m){

  </tr>`;
}

function briefExpr(e){
  if(!e) return "";
  const f=[];
  if(/p\s*\*/.test(e)){const m=e.match(/p\s*\*\s*([\d.]+)/);if(m)f.push("入×"+m[1]);}
  if(/c\s*\*/.test(e)){const m=e.match(/\bc\s*\*\s*([\d.]+)/);if(m)f.push("出×"+m[1]);}
  if(/fixed\(/.test(e)){const m=e.match(/fixed\(([\d.]+)\)/);if(m)f.push("$"+m[1]+"/次");}
  if(/u\("seconds"\)/.test(e)){const m=e.match(/u\("seconds"\)\s*\*\s*([\d.]+)/);if(m)f.push("$"+m[1]+"/秒");}
  if(/len\s*[<=>]/.test(e)) f.push("按长度分档");
  return f.length? f.join(" · ") : "自定义表达式";
}
function sortList(ms){
  const q=S.q.trim().toLowerCase();
  let out=ms.slice();
  if(q) out=out.filter(m=>m.n.toLowerCase().includes(q)||(ch().vendors[String(m.v)]||"").toLowerCase().includes(q));
  if(S.sort==="ratio") out.sort((a,b)=>(b.mr||0)-(a.mr||0));
  else out.sort((a,b)=>a.n.localeCompare(b.n));
  return out;
}

    <div class="mb"><table style="margin-top:8px">
      <colgroup><col style="width:34%"><col style="width:13%"><col style="width:21%"><col style="width:11%"><col style="width:10%"><col style="width:11%"></colgroup>
      <thead><tr><th>模型</th><th>厂商</th><th>能力标签</th><th style="text-align:right">倍率</th><th style="text-align:right">补全</th><th>协议</th></tr></thead>
      <tbody>${body||`<tr><td colspan="6" class="dim" style="text-align:center;padding:22px">没有匹配的模型</td></tr>`}</tbody></table></div>
    <div class="mf"><span class="info">共 ${all.length} 个${S.q?"（已搜索）":""}</span>
      <div class="pg"><button data-p="prev" ${S.page===1?"disabled":""}>‹</button>${pager.join("")}
      <button data-p="next" ${S.page===pages?"disabled":""}>›</button></div></div>`;
  $("#mod").classList.add("on"); $("#ov").classList.add("on");
}
function closeModal(){ S.modal=false; $("#mod").classList.remove("on"); $("#ov").classList.remove("on"); }

document.addEventListener("click",e=>{
  const t=e.target.closest(".tab"); if(t){S.cid=t.dataset.cid;S.g=null;S.q="";S.page=1;S.degrade=null;render();renderDg();return;}
  const c=e.target.closest(".chip"); if(c){const k=c.dataset.g;S.g=(S.g===k)?null:k;S.q="";S.page=1;render();return;}
  const a=e.target.closest("[data-act]");
  if(a){const k=a.dataset.act;
    if(k==="all"){S.modal=true;S.page=1;renderModal();}
    if(k==="close") closeModal();
    if(k==="retry"){S.degrade="ok";render();renderDg();}
    return;}
  const p=e.target.closest("[data-p]");
  if(p){const all=sortList(modelsOf(curG()));const pages=Math.max(1,Math.ceil(all.length/S.ps));const v=p.dataset.p;
    if(v==="prev")S.page=Math.max(1,S.page-1); else if(v==="next")S.page=Math.min(pages,S.page+1); else S.page=Number(v);
    renderModal();return;}
  const s=e.target.closest("[data-sort]"); if(s){S.sort=s.dataset.sort;S.page=1;renderModal();return;}
  const d=e.target.closest("[data-dg]"); if(d){S.degrade=d.dataset.dg==="ok"?null:d.dataset.dg;renderDg();render();return;}
  if(e.target.id==="ov") closeModal();
});
document.addEventListener("input",e=>{
  if(e.target.id==="mq"){S.q=e.target.value;S.page=1;renderModal();
    const i=document.getElementById("mq"); if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if(S.modal) closeModal(); else if(S.g){S.g=null;render();} }
});
$("#th").onclick=()=>{const d=document.documentElement.classList.toggle("dark");$("#th").textContent=d?"浅色":"深色";};

const h=decodeURIComponent(location.hash.replace("#",""));
if(h){const [cid,g,act]=h.split("/"); if(cid&&RD[cid])S.cid=cid; if(g)S.g=g; if(act==="all")S.modal=true;}
if(h.includes("dg:auth"))S.degrade="auth";
render();renderDg();
</script>
</body>
</html>
